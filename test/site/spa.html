<!doctype html>
<html>
<head><meta charset="utf-8" /><title>Client-side routes</title>
<style>body { font-family: system-ui; padding: 24px; } .card { padding: 20px; border: 1px solid #ddd; border-radius: 10px; margin-top: 16px; }</style>
</head>
<body>
<!-- A router in miniature: pushState, no page load. Notes are keyed by URL, so each route is its own page. -->
<nav><button id="to-a">Route A</button> <button id="to-b">Route B</button></nav>
<div id="view"></div>
<script>
  const render = () => {
    const b = new URLSearchParams(location.search).get("route") === "b";
    document.getElementById("view").innerHTML = b
      ? '<div class="card" id="route-b-card">Route B content</div>'
      : '<div class="card" id="route-a-card">Route A content</div>';
  };
  document.getElementById("to-a").onclick = () => { history.pushState({}, "", "/spa.html"); render(); };
  document.getElementById("to-b").onclick = () => { history.pushState({}, "", "/spa.html?route=b"); render(); };
  window.addEventListener("popstate", render);
  render();
</script>
</body>
</html>
