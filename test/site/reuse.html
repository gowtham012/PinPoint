<!doctype html><html><head><meta charset="utf-8"><title>Reuse test</title>
<style>body{font-family:sans-serif;margin:0} .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:24px} .card{border:1px solid #ccc;border-radius:8px;padding:12px}</style></head><body>
<!-- No framework: four cards stamped from the same template, and one button that exists once. -->
<div class="grid">
  <div class="card"><h3>Mug</h3><button class="add">Add</button></div>
  <div class="card"><h3>Shirt</h3><button class="add">Add</button></div>
  <div class="card"><h3>Hat</h3><button class="add">Add</button></div>
  <div class="card"><h3>Socks</h3><button class="add">Add</button></div>
</div>
<button id="checkout" class="checkout">Checkout</button>
</body></html>
