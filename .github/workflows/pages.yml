# The site at https://gowtham012.github.io/PinPoint/ — site/index.html plus the demo media, which
# live in docs/ for the README and are copied in here rather than kept twice in git.
name: pages

on:
  push:
    branches: [main]
    paths: ["site/**", "docs/demo.*", "docs/images/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Build the site
        run: |
          mkdir -p _site/images
          cp site/* _site/
          cp docs/demo.* _site/
          cp docs/images/* _site/images/
          ls -la _site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v5
