<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  /* The same tokens as the on-page UI (content.js), so the popup and the bar read as one product.
     Dark mode is a redefinition, not a second stylesheet. */
  /* The same ink and lime as the overlay on the page, in every theme. */
  :root {
    --sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --ink: #f5f5f5; --ink-dim: #a8a8a8; --ink-3: #8c8c8c;
    --surface: #121212; --surface-2: #1f1f1f; --surface-3: #2d2d2d;
    --line: rgba(255,255,255,.08); --field: rgba(255,255,255,.13);
    --accent: #c6f432; --accent-hover: #d4f95e; --accent-text: #c6f432; --accent-ink: #121212;
    --ok: #c6f432; --bad: #ff7a7f; --agent: #5cc8ff;
    --note-ink: #f2c14e; --note-bg: rgba(242,193,78,.08); --note-line: rgba(242,193,78,.25);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { width: 340px; margin: 0; font: 13px/1.4 var(--sans); color: var(--ink); background: var(--surface); }
  svg { width: 15px; height: 15px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  header { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 14px; font-weight: 600; margin: 0; flex: 1; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); }
  .dot.on { background: var(--ok); box-shadow: 0 0 0 3px rgba(198,244,50,.18); } .dot.off { background: var(--bad); }
  .status { font-size: 11px; color: var(--ink-dim); max-width: 190px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  main { padding: 12px 14px; display: grid; gap: 8px; }
  button { border: 0; border-radius: 8px; padding: 9px 12px; font: 500 13px var(--sans); cursor: pointer; background: var(--surface-2); color: var(--ink); text-align: left; display: flex; align-items: center; gap: 8px; }
  button:hover { background: var(--surface-3); }
  button:disabled { opacity: .45; cursor: default; }
  button:disabled:hover { background: var(--surface-2); }
  button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.primary { background: var(--accent); color: var(--accent-ink); font-weight: 600; padding: 11px 12px; }
  button.primary:hover { background: var(--accent-hover); }
  button kbd { margin-left: auto; font: 500 11px var(--mono); background: rgba(0,0,0,.14); border-radius: 5px; padding: 3px 6px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .row button { justify-content: center; font-size: 12px; padding: 8px 10px; background: transparent; box-shadow: inset 0 0 0 1px var(--field); }
  .row button:hover { background: var(--surface-2); }
  #bridge { font-size: 12px; padding: 8px 10px; color: var(--ink-dim); background: transparent; box-shadow: inset 0 0 0 1px var(--field); justify-content: center; }
  #bridge:hover { color: var(--ink); background: var(--surface-2); }
  .agent { display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: var(--ink-dim); min-height: 22px; }
  .agent[hidden], #grant[hidden] { display: none; }
  .agent .who { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .agent .led { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-3); flex: none; }
  .agent.live .led { background: var(--agent); }
  .agent button { font-size: 11px; padding: 3px 8px; border-radius: 6px; background: transparent; color: var(--accent-text); }
  .agent button:hover { background: var(--surface-2); }
  ul { list-style: none; margin: 0; padding: 4px 6px; max-height: 240px; overflow: auto; border-top: 1px solid var(--line); }
  li { padding: 8px; border-radius: 8px; display: flex; gap: 8px; align-items: flex-start; cursor: pointer; }
  li:hover { background: var(--surface-2); }
  li .n { background: var(--accent); color: var(--accent-ink); border-radius: 10px 10px 10px 3px; min-width: 20px; height: 20px; font: 700 11px/20px var(--sans); text-align: center; padding: 0 5px; flex-shrink: 0; }
  li .c { flex: 1; min-width: 0; }
  li .c .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  li .c .s { font: 10px var(--mono); color: var(--ink-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  li .c .u { font-size: 10px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  li .c .u.current { color: var(--accent-text); }
  li .x { color: var(--ink-3); cursor: pointer; padding: 2px 6px; background: none; border-radius: 6px; font-weight: 400; opacity: 0; }
  li:hover .x, li:focus-within .x, li .x:focus-visible { opacity: 1; }
  li .x:hover { color: var(--bad); background: var(--surface); }
  .empty { padding: 14px; color: var(--ink-dim); text-align: center; font-size: 12px; }
  footer { padding: 8px 14px; border-top: 1px solid var(--line); display: flex; gap: 6px; align-items: center; font-size: 11px; color: var(--ink-dim); white-space: nowrap; }
  footer input { width: 64px; border: 1px solid var(--field); border-radius: 6px; padding: 3px 6px; font: inherit; background: var(--surface); color: var(--ink); }
  footer select { max-width: 92px; border: 1px solid var(--field); border-radius: 6px; padding: 3px 4px; font: inherit; background: var(--surface); color: var(--ink); }
  footer .spacer { flex: 1; }
  footer a { color: var(--accent-text); text-decoration: none; }
  #clear { background: none; padding: 0; font: inherit; color: var(--ink-dim); }
  #clear:hover { color: var(--bad); background: none; }
  .hint { font-size: 11px; color: var(--ink-dim); line-height: 1.45; }
  .hint:empty { display: none; }
  .hint code { font: 10.5px/1.5 var(--mono); background: var(--surface-2); border-radius: 4px; padding: 1px 4px; word-break: break-all; }
  .hint button { margin-top: 6px; font-size: 12px; padding: 6px 10px; }
  .where { display: none; font-size: 11.5px; line-height: 1.45; color: var(--note-ink); background: var(--note-bg); border: 1px solid var(--note-line); border-radius: 8px; padding: 8px 10px; }
  .where button { margin-top: 6px; font-size: 12px; padding: 6px 10px; background: var(--surface); }
  .tokenbox { display: grid; gap: 6px; font-size: 11.5px; }
  .tokenbox[hidden] { display: none; }
  .tokenbox .trow { display: flex; gap: 6px; }
  .tokenbox input { flex: 1; min-width: 0; border: 1px solid var(--field); border-radius: 6px; padding: 6px 8px; font: 11px var(--mono); background: var(--surface); color: var(--ink); }
  .tokenbox button { padding: 6px 12px; }
</style>
</head>
<body>
  <header>
    <span class="dot" id="dot"></span>
    <h1>Pinpoint</h1>
    <span class="status" id="status" role="status">checking bridge…</span>
  </header>
  <main>
    <div class="where" id="where"></div>
    <button id="grant" hidden>Grant access to local sites</button>
    <button class="primary" id="pick">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4l7 16 2.5-6.5L20 11z"/></svg>
      <span class="pl">Annotate an element</span> <kbd id="kpick">⌥⇧A</kbd>
    </button>
    <div class="row">
      <button id="copyAll"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>Copy all</button>
      <button id="showbar"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="15" width="18" height="5" rx="2.5"/><path d="M12 4v7M9 8l3 3 3-3"/></svg>Show the bar</button>
    </div>
    <button id="bridge" data-state="start"><span class="bg" aria-hidden="true"></span><span class="bl">Start bridge</span></button>
    <div class="tokenbox" id="tokenBox" hidden>
      <label for="token">Bridge token</label>
      <div class="trow"><input id="token" autocomplete="off" spellcheck="false" placeholder="paste the output of: cli.js token" /><button id="tokenSave">Save</button></div>
    </div>
    <div class="agent" id="agent" hidden>
      <span class="led" aria-hidden="true"></span><span class="who" id="agentWho"></span>
      <button id="watch" title="Copy a prompt that keeps your agent picking up notes as you make them">Copy watch prompt</button>
    </div>
    <div class="hint" id="hint" role="status"></div>
  </main>
  <ul id="list"></ul>
  <footer>
    <label for="port">Port</label><input id="port" type="number" min="1024" max="65535" />
    <label for="dockPos">Bar</label><select id="dockPos"><option value="tr">↗ Top right</option><option value="tl">↖ Top left</option><option value="br">↘ Bottom right</option><option value="bl">↙ Bottom left</option></select>
    <span class="spacer"></span>
    <button id="clear" title="Delete every pending note">Clear all</button>
    <a href="#" id="help" title="Setup guide">Guide</a>
  </footer>
  <script src="popup.js"></script>
</body>
</html>
