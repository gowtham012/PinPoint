<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pinpoint</title>
<style>
  :root { --bg: #f6f6f4; --fg: #1d1d1f; --muted: #6e6e73; --card: #fff; --line: #d9d9d6; --accent: #c6f432; --on-accent: #121212; }
  @media (prefers-color-scheme: dark) { :root { --bg: #161617; --fg: #f2f2f2; --muted: #9a9a9f; --card: #232325; --line: #3a3a3d; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.4 -apple-system, system-ui, sans-serif; }
  header { display: flex; gap: 12px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); }
  header b { font-weight: 600; }
  #status { color: var(--muted); flex: 1; }
  button { font: inherit; padding: 5px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--card); color: var(--fg); cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  main { display: flex; justify-content: center; padding: 16px; }
  #stage { position: relative; cursor: crosshair; line-height: 0; }
  #shot { max-height: calc(100vh - 90px); max-width: 100%; border-radius: 12px; box-shadow: 0 2px 16px #0003; user-select: none; }
  .box { position: absolute; border: 2px solid var(--accent); outline: 1px solid #121212; background: color-mix(in srgb, var(--accent) 10%, transparent); pointer-events: none; border-radius: 3px; }
  #tip { position: absolute; transform: translateY(-100%); background: var(--fg); color: var(--bg); font-size: 12px; line-height: 1.3; padding: 2px 6px; border-radius: 4px; white-space: nowrap; pointer-events: none; }
  .pin { position: absolute; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%; background: var(--accent); color: var(--on-accent); box-shadow: 0 0 0 2px #121212; font: 600 12px/22px system-ui; text-align: center; pointer-events: auto; cursor: help; }
  #pop { position: absolute; width: 280px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px; line-height: 1.4; box-shadow: 0 6px 24px #0004; z-index: 2; cursor: default; }
  #pop .what { color: var(--muted); font-size: 12px; margin-bottom: 6px; overflow-wrap: anywhere; }
  #pop textarea { width: 100%; height: 70px; font: inherit; padding: 6px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); resize: vertical; }
  .pin.ask { background: #ffb020; }
  /* A note's conversation, and the agent's reply when it is done. */
  #note, #done { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px; line-height: 1.4; box-shadow: 0 6px 24px #0004; cursor: default; overflow-wrap: anywhere; }
  #note { position: absolute; width: 300px; z-index: 3; }
  #done { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); width: min(460px, calc(100vw - 32px)); z-index: 4; }
  .msg { margin: 0 0 8px; }
  .msg b { display: block; font-size: 12px; color: var(--muted); font-weight: 600; }
  #note textarea, #done textarea { width: 100%; height: 56px; font: inherit; padding: 6px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); resize: vertical; }
  .row { display: flex; justify-content: flex-end; gap: 6px; margin-top: 6px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <b id="name">Pinpoint</b>
  <span id="status">Loading…</span>
  <button id="refresh" title="Take a fresh screenshot (R)">Refresh</button>
</header>
<main>
  <div id="stage">
    <img id="shot" alt="Device screen">
    <div id="hover" class="box" hidden></div>
    <div id="tip" hidden></div>
    <div id="pop" hidden>
      <div class="what" id="what"></div>
      <textarea id="comment" placeholder="What should change — how it looks or what it does?"></textarea>
      <div class="row"><button id="cancel">Cancel</button><button id="send" class="primary">Send ⌘↩</button></div>
    </div>
    <div id="note" hidden></div>
  </div>
</main>
<div id="done" hidden>
  <div class="msg"><b id="donewho"></b><span id="donetext"></span></div>
  <div class="row" id="donebtns"><button id="notquite">Not quite</button><button id="accept" class="primary">Accept</button></div>
  <form id="reopen" hidden><textarea placeholder="Not quite? Say what is still wrong — the note reopens" aria-label="What is still wrong"></textarea><div class="row"><button type="submit" class="primary">Reopen ⌘↩</button></div></form>
</div>
<script>
// Everything shown from the tree goes through textContent: labels come from the app and are untrusted.
const $ = (id) => document.getElementById(id);
// One page for both: /ios reads the Simulator through Maestro, /android the emulator through adb.
const KIND = location.pathname.startsWith("/android") ? "android" : "ios";
const DEVICE = { ios: "iOS Simulator", android: "Android emulator" }[KIND];
const READING = { ios: "Reading the simulator… (the first time takes a few seconds)", android: "Reading the emulator…" }[KIND];
document.title = "Pinpoint — " + DEVICE;
$("name").textContent = "Pinpoint · " + DEVICE;
const shot = $("shot"), stage = $("stage"), hover = $("hover"), tip = $("tip"), pop = $("pop"), note = $("note"), done = $("done");
let screen = null, picked = null, pins = [], version = 0;
// The note whose conversation is open, and the done notes already shown (null until the first load:
// what was finished before the page opened is history, not news).
let open = null, seenDone = null, shown = null, doneTimer = 0;
const post = (p, body) => fetch(p, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) }).then((r) => r.json());

const describe = (n) => n.id ? "#" + n.id : (n.label || n.text || n.value) ? `"${(n.label || n.text || n.value).slice(0, 50)}"` : "view";
// On-screen pixels per point, since the image is scaled to fit the window.
const scale = () => shot.clientWidth / screen.viewport.width;
const place = (el, b) => Object.assign(el.style, { left: b.x * scale() + "px", top: b.y * scale() + "px", width: b.width * scale() + "px", height: b.height * scale() + "px" });

// The smallest node under the point is the one you meant; a full-screen container never is.
function nodeAt(x, y) {
  let best = null;
  for (const n of screen.nodes) {
    const b = n.bounds;
    if (x < b.x || y < b.y || x > b.x + b.width || y > b.y + b.height) continue;
    if (!best || b.width * b.height < best.bounds.width * best.bounds.height) best = n;
  }
  return best;
}
function pointFrom(e) {
  const r = shot.getBoundingClientRect();
  return [(e.clientX - r.left) / scale(), (e.clientY - r.top) / scale()];
}

async function load() {
  $("status").textContent = READING;
  closePop();
  const res = await fetch(`/${KIND}/screen`, { headers: { "x-pinpoint": "1" } });
  const body = await res.json();
  if (!res.ok) { $("status").textContent = body.error; return; }
  screen = body;
  shot.src = "data:image/png;base64," + body.png;
  await shot.decode();
  $("status").textContent = `${body.device.name} — ${body.nodes.length} elements. Hover, click one, say what should change.`;
  loadPins();
}

// The open notes on this device are pins — "?" when the agent asked you something. A note the agent
// has just finished shows its reply instead of vanishing.
async function loadPins() {
  if (!screen) return;
  const body = await (await fetch("/annotations?url=" + encodeURIComponent(screen.url))).json();
  version = body.version;
  pins.forEach((p) => p.remove());
  const live = body.annotations.filter((a) => a.status === "pending" || a.status === "waiting");
  pins = live.map((a) => {
    const p = document.createElement("div");
    p.className = a.status === "waiting" ? "pin ask" : "pin";
    p.textContent = a.status === "waiting" ? "?" : a.number;
    p.title = `#${a.number}: ${a.comment}`;
    p.style.left = (a.element.rect.x + a.element.rect.width) * scale() + "px";
    p.style.top = a.element.rect.y * scale() + "px";
    p.addEventListener("click", (e) => { e.stopPropagation(); showNote(a, p); });
    stage.append(p);
    return p;
  });
  // Keep the open conversation unless it changed under you (then show the new state).
  if (open) {
    const a = live.find((x) => x.id === open.id), p = pins[live.indexOf(a)];
    if (!a) closeNote();
    else if (a.status + (a.thread || []).length !== open.key) showNote(a, p);
  }
  const finished = body.annotations.filter((a) => a.status === "resolved" && !a.acceptedAt);
  if (seenDone) {
    const fresh = finished.filter((a) => !seenDone.has(a.id + a.resolvedAt));
    if (fresh.length) showDone(fresh[fresh.length - 1]);
  }
  seenDone = new Set(finished.map((a) => a.id + a.resolvedAt));
}

// Agent text is untrusted: every line goes in through textContent.
function line(who, text) {
  const d = document.createElement("div"), b = document.createElement("b"), t = document.createElement("span");
  d.className = "msg"; b.textContent = who; t.textContent = text;
  d.append(b, t);
  return d;
}
function showNote(a, pin) {
  closePop();
  open = { id: a.id, key: a.status + (a.thread || []).length };
  note.replaceChildren(line(`#${a.number} · you`, a.comment));
  for (const m of a.thread || []) note.append(line(m.by === "you" ? "You" : (m.name || "Your agent") + (m.kind === "resolution" ? " (done)" : ""), m.text));
  if (a.status === "waiting") {
    const f = document.createElement("form"), ta = document.createElement("textarea"), row = document.createElement("div"), go = document.createElement("button");
    ta.placeholder = "Your answer"; ta.setAttribute("aria-label", "Your answer");
    row.className = "row"; go.type = "submit"; go.className = "primary"; go.textContent = "Answer ⌘↩";
    row.append(go); f.append(ta, row); note.append(f);
    f.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = ta.value.trim();
      if (!text) return ta.focus();
      go.disabled = true;
      const r = await post(`/annotations/${a.id}/answer`, { text }).catch(() => null);
      go.disabled = false;
      if (!r?.ok) return void ($("status").textContent = "Not sent — the bridge isn't answering.");
      $("status").textContent = `Answered #${a.number} — sent to your agent.`;
      closeNote();
      loadPins();
    });
    setTimeout(() => ta.focus());
  } else {
    note.append(line("", "Waiting for your agent."));
  }
  note.style.left = Math.max(0, Math.min(parseFloat(pin.style.left) - 300, shot.clientWidth - 300)) + "px";
  note.style.top = parseFloat(pin.style.top) + 16 + "px";
  note.hidden = false;
  // Kept on screen: a pin low on the phone opens its card upwards.
  const over = note.offsetTop + note.offsetHeight - shot.clientHeight;
  if (over > 0) note.style.top = Math.max(0, parseFloat(pin.style.top) - 16 - note.offsetHeight) + "px";
}
function closeNote() { note.hidden = true; open = null; }

// "#3 done": the agent's reply, and the two things you might say to it, for a while.
function showDone(a) {
  shown = a;
  $("donewho").textContent = `#${a.number} done · ${a.resolvedBy || "your agent"}`;
  $("donetext").textContent = a.resolution || "marked it done";
  $("donebtns").hidden = false; $("reopen").hidden = true; $("reopen").querySelector("textarea").value = "";
  done.hidden = false;
  armDone();
}
function armDone() {
  clearTimeout(doneTimer);
  doneTimer = setTimeout(() => { if (!done.matches(":hover") && $("reopen").hidden) hideDone(); else armDone(); }, 20000);
}
function hideDone() { clearTimeout(doneTimer); done.hidden = true; shown = null; }
$("accept").onclick = async () => {
  const a = shown;
  hideDone();
  const r = await post(`/annotations/${a.id}/accept`, {}).catch(() => null);
  $("status").textContent = r?.ok ? `Accepted #${a.number}.` : "Not accepted — the bridge isn't answering.";
};
$("notquite").onclick = () => {
  $("donebtns").hidden = true; $("reopen").hidden = false;
  $("reopen").querySelector("textarea").focus();
};
$("reopen").addEventListener("submit", async (e) => {
  e.preventDefault();
  const a = shown, text = $("reopen").querySelector("textarea").value.trim();
  if (!text) return;
  const r = await post(`/annotations/${a.id}/answer`, { text }).catch(() => null);
  if (!r?.ok) return void ($("status").textContent = "Not sent — the bridge isn't answering.");
  hideDone();
  $("status").textContent = `Reopened #${a.number} — sent to your agent.`;
  loadPins();
});

// Pins follow the bridge as it changes — a question or a reply shows without a refresh.
async function watch() {
  for (;;) {
    try {
      const r = await (await fetch(`/events?since=${version}&timeout=25000`)).json();
      const changed = r.changed;
      version = r.version;
      if (changed) await loadPins();
    } catch { await new Promise((r) => setTimeout(r, 3000)); }
  }
}

shot.addEventListener("mousemove", (e) => {
  if (!screen || !pop.hidden) return;
  const n = nodeAt(...pointFrom(e));
  hover.hidden = tip.hidden = !n;
  if (!n) return;
  place(hover, n.bounds);
  tip.textContent = describe(n);
  tip.style.left = n.bounds.x * scale() + "px";
  tip.style.top = n.bounds.y * scale() - 2 + "px";
});
shot.addEventListener("mouseleave", () => { if (pop.hidden) hover.hidden = tip.hidden = true; });

shot.addEventListener("click", (e) => {
  if (!screen) return;
  closeNote();
  picked = nodeAt(...pointFrom(e));
  if (!picked) return;
  place(hover, picked.bounds);
  hover.hidden = false; tip.hidden = true;
  $("what").textContent = picked.path;
  const b = picked.bounds, s = scale();
  pop.style.left = Math.min(b.x * s, shot.clientWidth - 280) + "px";
  pop.style.top = (b.y + b.height) * s + 6 + "px";
  pop.hidden = false;
  $("comment").value = "";
  $("comment").focus();
});

function closePop() { pop.hidden = hover.hidden = true; picked = null; }

// Crop the node out of the full-resolution screenshot, with a little context around it.
function crop(b) {
  const dpr = shot.naturalWidth / screen.viewport.width, pad = 8;
  const x = Math.max(0, (b.x - pad) * dpr), y = Math.max(0, (b.y - pad) * dpr);
  const w = Math.min(shot.naturalWidth - x, (b.width + pad * 2) * dpr), h = Math.min(shot.naturalHeight - y, (b.height + pad * 2) * dpr);
  const c = document.createElement("canvas");
  c.width = Math.round(w); c.height = Math.round(h);
  c.getContext("2d").drawImage(shot, x, y, w, h, 0, 0, w, h);
  return { base64: c.toDataURL("image/png").split(",")[1], width: c.width, height: c.height };
}

async function send() {
  const comment = $("comment").value.trim();
  if (!comment || !picked) return;
  $("send").disabled = true;
  try {
    const res = await fetch(`/${KIND}/annotations`, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ comment, node: picked, device: screen.device, viewport: screen.viewport, screenshot: crop(picked.bounds) }),
    });
    const body = await res.json();
    if (!res.ok) throw new Error(body.error);
    $("status").textContent = `Sent #${body.number} to your agent.`;
    closePop();
    loadPins();
  } catch (e) {
    $("status").textContent = "Could not send: " + e.message;
  } finally {
    $("send").disabled = false;
  }
}

$("send").onclick = send;
$("cancel").onclick = closePop;
$("refresh").onclick = load;
document.addEventListener("keydown", (e) => {
  const form = e.target.closest?.("form");
  if (form && e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); return form.requestSubmit(); }
  if (e.key === "Escape") { closePop(); closeNote(); if ($("reopen").hidden) hideDone(); }
  else if (e.target.tagName === "TEXTAREA" && e.target.id !== "comment") return;
  else if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) send();
  else if (e.key.toLowerCase() === "r" && pop.hidden && !e.metaKey && !e.ctrlKey) load();
});
window.addEventListener("resize", () => screen && (closePop(), loadPins()));
load();
watch();
</script>
</body>
</html>
